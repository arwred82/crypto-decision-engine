name = "crypto-decision-engine-04"
main = "src/worker.js"
compatibility_date = "2026-09-23"

[assets]
directory = "./public"
binding = "ASSETS"
run_worker_first = ["/api/*"]

[triggers]
# Cloudflare Cron is UTC. We run at both 06:00 and 07:00 UTC and the Worker
# itself executes only when Europe/Budapest local time is exactly 08:00.
crons = ["0 6 * * *", "0 7 * * *"]

[[d1_databases]]
binding = "DB"
database_name = "crypto-decision-engine-db"
database_id = "aa686fda-fc51-47c5-8b1c-d80eb475f503"
