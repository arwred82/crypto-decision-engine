<!doctype html><html lang="hu"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Crypto Decision Engine 04</title><style>
body{font-family:system-ui;background:#0f1117;color:#eee;margin:0;padding:16px}.wrap{max-width:1100px;margin:auto}.card{background:#181c25;border:1px solid #2b3140;border-radius:14px;padding:16px;margin:12px 0}button{background:#2563eb;color:white;border:0;border-radius:9px;padding:11px 16px;font-weight:700}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:12px}.metric{color:#aeb6c7;font-size:13px}.value{font-size:21px;font-weight:700;margin-top:4px}.good{color:#65d48a}.bad{color:#ff6b6b}.warn{color:#f2c14e}table{width:100%;border-collapse:collapse;display:block;overflow-x:auto}td,th{padding:8px;border-bottom:1px solid #2b3140;text-align:left;white-space:nowrap}.small{font-size:12px;color:#8f98aa}</style></head><body><div class="wrap"><h1>Crypto Decision Engine 04</h1><p class="small">500 USDT paper portfolio • BTC / ETH / SOL / XRP • 1D regime + 4H execution</p><div class="card"><button onclick="run()">🔄 FRISSÍTÉS ÉS ELEMZÉS</button> <span id="status" class="small"></span></div><div id="app"></div></div><script>
async function run(){const s=document.getElementById('status');s.textContent='Fut...';try{const r=await fetch('/api/run',{method:'POST'}),x=await r.json();if(!r.ok)throw Error(x.error||'Hiba');s.textContent='Kész: '+new Date(x.updated_at).toLocaleString('hu-HU');render(x)}catch(e){s.textContent='Hiba: '+e.message}}
function n(v,d=2){return Number.isFinite(Number(v))?Number(v).toFixed(d):'—'}
function render(x){const p=x.portfolio;document.getElementById('app').innerHTML=`<div class="grid"><div class="card metric">KEZDŐTŐKE<div class="value">${n(p.starting_usdt)} USDT</div></div><div class="card metric">EQUITY<div class="value">${n(p.equity)} USDT</div></div><div class="card metric">CASH<div class="value">${n(p.cash_usdt)} USDT</div></div><div class="card metric">REALIZÁLT P/L<div class="value ${p.realized_pnl>=0?'good':'bad'}">${n(p.realized_pnl)} USDT</div></div></div><div class="card"><h2>Nyitott pozíciók</h2>${x.positions.length?`<table><tr><th>Coin</th><th>Strategy</th><th>Entry</th><th>SL</th><th>TP1</th><th>TP2</th><th>Qty</th></tr>${x.positions.map(q=>`<tr><td>${q.symbol}</td><td>${q.strategy}</td><td>${n(q.entry)}</td><td>${n(q.sl)}</td><td>${n(q.tp1)}</td><td>${n(q.tp2)}</td><td>${n(q.qty,6)}</td></tr>`).join('')}</table>`:'Nincs nyitott pozíció.'}</div><div class="card"><h2>Legutóbbi scan</h2><table><tr><th>Coin</th><th>1D Regime</th><th>Strategy</th><th>Decision</th><th>Price</th><th>RSI</th><th>ADX</th><th>Vol</th></tr>${x.scans.map(q=>`<tr><td>${q.symbol}</td><td>${q.regime}</td><td>${q.strategy}</td><td class="${q.decision==='BUY'?'good':'bad'}">${q.decision}</td><td>${n(q.price)}</td><td>${n(q.rsi,1)}</td><td>${n(q.adx,1)}</td><td>${n(q.volumeRatio,2)}</td></tr>`).join('')}</table></div><div class="card"><h2>Legutóbbi lezárt trade-ek</h2>${x.trades.length?`<table><tr><th>Coin</th><th>Entry</th><th>Exit</th><th>P/L</th><th>Reason</th></tr>${x.trades.slice(0,10).map(q=>`<tr><td>${q.symbol}</td><td>${n(q.entry)}</td><td>${n(q.exit)}</td><td class="${q.pnl>=0?'good':'bad'}">${n(q.pnl)}</td><td>${q.reason}</td></tr>`).join('')}</table>`:'Még nincs lezárt trade.'}</div>`}
async function init(){try{const r=await fetch('/api/state'),x=await r.json();if(!r.ok)throw Error(x.error||'Hiba');render(x)}catch(e){document.getElementById('status').textContent='Állapot lekérése sikertelen: '+e.message}}init();
</script></body></html>
